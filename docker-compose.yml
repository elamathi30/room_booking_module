# Local development stack: Odoo 18, PostgreSQL, and Mailpit for safe
# reminder-email capture; Docker Compose wires the services together.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
  odoo:
    image: odoo:18.0
    depends_on: [db, mailpit]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./room_booking:/mnt/extra-addons/room_booking
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
volumes:
  db-data:
